# Builds the blog from Markdown (Pages CMS commits) and deploys the WHOLE site to GitHub Pages.
# Requires: Repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test blog generator
        run: npm test

      # Fails the run (and blocks deployment) on invalid published articles,
      # missing images, duplicate slugs or any attempt to overwrite a hand-written file.
      - name: Generate blog pages and sitemap
        run: npm run build

      - name: Assemble complete site (existing pages + generated blog)
        run: scripts/assemble-site.sh _site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
